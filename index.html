<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titanic Survival Predictor</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div id="cursor-blob" class="cursor-blob"></div>

    <main class="glass-card">
        <header class="card-header">
            <div class="badge">AI Prediction</div>
            <h2>Titanic Survival Predictor</h2>
            <p>Enter passenger attributes to compute survival probability.</p>
        </header>

        <form onsubmit="event.preventDefault(); predict();" class="glass-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="pclass">Passenger Class</label>
                    <div class="select-wrapper">
                        <select id="pclass">
                            <option value="1">1st Class (Luxury)</option>
                            <option value="2">2nd Class (Middle)</option>
                            <option value="3" selected>3rd Class (Economy)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="sex">Gender</label>
                    <div class="select-wrapper">
                        <select id="sex">
                            <option value="0">Male</option>
                            <option value="1">Female</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" value="26" min="0" max="100" step="1">
                </div>

                <div class="form-group">
                    <label for="fare">Fare (£)</label>
                    <input type="number" id="fare" value="7.925" step="0.01" min="0">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="sibsp">Siblings / Spouses</label>
                    <input type="number" id="sibsp" value="0" min="0">
                </div>

                <div class="form-group">
                    <label for="parch">Parents / Children</label>
                    <input type="number" id="parch" value="0" min="0">
                </div>
            </div>

            <button type="submit" id="predict-btn" class="glass-btn">
                <span>Run Prediction</span>
                <div class="btn-glow"></div>
            </button>
        </form>

        <div id="result" class="result-box hidden"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
